server:
  port: 8080

spring:
  application:
    name: ocop-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/ocop_db_new
    username: postgres
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Cấu hình Swagger / OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Cấu hình logging
logging:
  level:
    com.ocop: DEBUG
    org.springframework.web: INFO

# Cấu hình JWT Token (Secret 256-bit chuẩn HMAC SHA-256)
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 giờ

# Cấu hình kết nối mạng Blockchain & Smart Contract
blockchain:
  rpc-url: http://127.0.0.1:8545
  contract-address: "0x5fbdb2315678afecb367f032d93f642f64180aa3"
  # Private key của tài khoản Account #0 từ Hardhat Node (ví có sẵn 10,000 ETH ảo để trả phí gas)
  private-key: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
  enabled: true